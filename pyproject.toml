[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-github"
version = "0.2.0"
description = "一条命令分析 GitHub 开源项目，生成结构化报告"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
analyse-github = "analyse_github.cli:main"

[tool.setuptools]
packages = ["analyse_github"]
